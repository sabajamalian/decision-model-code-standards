name: Decision-1 code standards
description: >-
  Check Python code against plain-English coding standards from a YAML file using
  Microsoft-Decision-1 in Microsoft Foundry. Annotates findings, writes a job summary,
  keeps one up-to-date PR comment, and fails when an `error` rule is violated.

inputs:
  endpoint:
    description: Foundry resource endpoint, for example https://<resource>.cognitiveservices.azure.com
    required: true
  deployment:
    description: Decision-1 deployment name. Defaults to settings.deployment in the config file.
    required: false
    default: ""
  config:
    description: Path to the standards YAML file.
    required: false
    default: .github/code-standards.yml
  scope:
    description: "`changed` (PR diff) or `all`. Defaults to settings.scope in the config file."
    required: false
    default: ""
  base-ref:
    description: Git ref to diff against when scope is `changed`, for example origin/main.
    required: false
    default: ""
  comment-on-pr:
    description: Create or update a single results comment on the pull request.
    required: false
    default: "true"
  python-version:
    description: Python version used to run the checker.
    required: false
    default: "3.12"
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: passed, passed with warnings, incomplete, or failed.
    value: ${{ steps.check.outputs.status }}
  errors:
    description: Number of `error` rule violations.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: Number of `warning` rule violations.
    value: ${{ steps.check.outputs.warnings }}
  exit-code:
    description: Checker exit code (0 pass, 1 error violations, 2 setup or request failure).
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install checker dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "pyyaml>=6.0"

    - name: Ask Decision-1 about the code
      id: check
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../..
        DECISION_ENDPOINT: ${{ inputs.endpoint }}
        DECISION_DEPLOYMENT: ${{ inputs.deployment }}
        CONFIG: ${{ inputs.config }}
        SCOPE: ${{ inputs.scope }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REPORT_DIR: ${{ runner.temp }}/decision-standards
      run: |
        mkdir -p "$REPORT_DIR"
        args=(--config "$CONFIG" --markdown-out "$REPORT_DIR/report.md" --json-out "$REPORT_DIR/report.json")
        if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
        set +e
        python -m standards_checker "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Update PR comment
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ runner.temp }}/decision-standards/report.md
      run: |
        if [ ! -s "$REPORT" ]; then
          echo "No report was produced; skipping the PR comment."
          exit 0
        fi
        marker='<!-- decision-standards-report -->'
        comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@"$REPORT" > /dev/null \
            || echo "::warning::Could not update the PR comment (fork PRs get a read-only token)."
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$REPORT" > /dev/null \
            || echo "::warning::Could not create the PR comment (fork PRs get a read-only token)."
        fi

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: decision-standards-report
        path: ${{ runner.temp }}/decision-standards/
        if-no-files-found: ignore

    - name: Fail on error-severity violations
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        case "${EXIT_CODE:-2}" in
          0) echo "Decision-1 standards check passed." ;;
          1) echo "::error::Decision-1 found violations of error-severity standards. See the annotations or PR comment."; exit 1 ;;
          *) echo "::error::Decision-1 standards check could not complete (exit code ${EXIT_CODE:-unknown})."; exit 2 ;;
        esac
