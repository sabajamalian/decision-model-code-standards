name: Code standards (Decision-1)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Which code to check
        type: choice
        options: [all, changed]
        default: all

permissions:
  contents: read
  id-token: write       # OIDC sign-in to Azure, no stored secrets
  pull-requests: write  # sticky results comment

concurrency:
  group: code-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decision-standards:
    name: Decision-1 standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR head (not the merge commit) so reported line numbers match the PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Check coding standards
        uses: ./.github/actions/decision-standards
        with:
          endpoint: ${{ vars.DECISION_ENDPOINT }}
          deployment: ${{ vars.DECISION_DEPLOYMENT }}
          scope: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
